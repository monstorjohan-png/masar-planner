<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مَسار — خطتك المحكمة في دقيقة</title>
<meta name="description" content="أجب عن 6 أسئلة واحصل على خطة أسبوعية محكمة تناسب ظروفك.">
<meta name="theme-color" content="#1A5C4D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF7; --card:#FFFFFF; --border:#E7E5DE; --muted:#71716B;
  --text:#1B1B18; --accent:#1A5C4D; --accent-hover:#14493E; --accent-soft:#E7F0EB;
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#131311; --card:#1D1D1A; --border:#30302A; --muted:#A8A49A;
  --text:#ECE9E1; --accent:#5FC2A6; --accent-hover:#7AD4B8; --accent-soft:#1E332C;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.8}
.wrap{max-width:620px;margin-inline:auto;padding-inline:1rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
header.top{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);z-index:10}
.top-in{display:flex;align-items:center;justify-content:space-between;padding:.7rem 0}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;text-decoration:none;color:inherit}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1.2rem}
[data-theme="dark"] .brand-mark{color:#131311}
.icon-btn{border:1px solid var(--border);background:var(--card);color:var(--text);width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.hero{padding:2.2rem 0 1.2rem;text-align:center}
.hero h1{font-size:1.7rem;margin:0 0 .4rem}
.hero p{color:var(--muted);margin:0 0 1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:.8rem 2rem;cursor:pointer;text-decoration:none}
[data-theme="dark"] .btn{color:#131311}
.btn:hover{background:var(--accent-hover)}
.btn.block{width:100%}
.btn.plain{background:var(--card);color:var(--text);border:1px solid var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.3rem;margin-bottom:1rem}
.card h2{font-size:1.05rem;margin:0 0 1rem;padding-bottom:.6rem;border-bottom:1px solid var(--border)}
.field{margin-bottom:1rem}
.field:last-child{margin-bottom:0}
label{font-weight:600;display:block;margin-bottom:.35rem}
.hint{font-size:.82rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.65rem .8rem;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input,select{color-scheme:light}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{color-scheme:dark}
::placeholder{color:var(--muted);opacity:1}
textarea{min-height:84px;resize:vertical}
input[type="range"]{accent-color:var(--accent);border:0;padding:0;background:transparent}
.val{font-weight:700;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:.4rem .95rem;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .chip[aria-pressed="true"]{color:#131311}
details{border-top:1px solid var(--border);padding-top:.9rem;margin-top:1rem}
summary{font-weight:600;cursor:pointer}
.warn{background:var(--accent-soft);border-radius:10px;padding:.6rem .9rem;font-size:.88rem;margin-top:.8rem}
.error{color:#B3261E;font-size:.88rem;min-height:1.4em;margin:.4rem 0 0}
[data-theme="dark"] .error{color:#E08A8A}
.hidden{display:none!important}
#plan h3{margin-top:0}
#plan h4{margin:1.1rem 0 .35rem}
#plan ul{margin:.3rem 0;padding-inline-start:1.1rem}
#plan li{margin-bottom:.3rem}
.sum{background:var(--accent-soft);border-radius:10px;padding:.7rem 1rem;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}
th,td{border:1px solid var(--border);padding:.45rem .5rem;text-align:right}
th{background:var(--bg)}
.check{list-style:none!important;padding:0!important}
.check li{border:1px solid var(--border);border-radius:10px;padding:.5rem .75rem;margin-bottom:.45rem}
.check label{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer;font-weight:400}
.check input{width:1.2rem;height:1.2rem;accent-color:var(--accent);flex:none;margin-top:.3rem}
.check input:checked+span{text-decoration:line-through;opacity:.6}
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.toolbar .btn{flex:1;padding:.65rem 1rem;font-size:.92rem;white-space:nowrap}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:1.5rem 0 2rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{
  header.top,.hero,#form,.toolbar,footer{display:none!important}
  .card{border:0}
  .wrap{max-width:100%}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#"><span class="brand-mark">م</span> مَسار</a>
    <button class="icon-btn" id="themeBtn" aria-label="تبديل المظهر">◐</button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>خطتك المحكمة في دقيقة</h1>
    <p>6 أسئلة قصيرة ← خطة أسبوعية تناسب وقتك وظروفك.</p>
    <a class="btn" href="#form">ابدأ الآن</a>
  </section>

  <form class="card" id="form">
    <h2>1 — وقتك</h2>
    <div class="field">
      <label for="hours">كم ساعة فراغ لديك يوميا؟ <span class="val" id="hoursVal">ساعتين</span></label>
      <input type="range" id="hours" min="0.5" max="8" step="0.5" value="2">
    </div>
    <div class="field">
      <label for="days">كم يوما بالأسبوع؟ <span class="val" id="daysVal">5 أيام</span></label>
      <input type="range" id="days" min="1" max="7" step="1" value="5">
    </div>
    <div class="field">
      <label for="job">ما وضعك؟</label>
      <select id="job">
        <option>موظف دوام كامل</option>
        <option>موظف دوام جزئي</option>
        <option>طالب</option>
        <option>عمل حر</option>
        <option>غير ذلك</option>
      </select>
    </div>

    <h2 style="margin-top:1.4rem">2 — هدفك</h2>
    <div class="field">
      <label for="goalKind">نوع الهدف</label>
      <select id="goalKind">
        <option>دخل إضافي / عمل</option>
        <option>تعلم مهارة</option>
        <option>دراسة / اختبار</option>
        <option>صحة / لياقة</option>
        <option>تنظيم الديون</option>
        <option>مشروع صغير</option>
      </select>
    </div>
    <div class="field">
      <label for="goalText">صِف هدفك بجملة واحدة</label>
      <textarea id="goalText" placeholder="مثال: أريد تعلم التصميم والحصول على أول عميل">أريد بناء مصدر دخل إضافي عبر مهارة رقمية.</textarea>
    </div>
    <div class="field">
      <label for="weeks">خلال كم أسبوع؟ <span class="val" id="weeksVal">8 أسابيع</span></label>
      <input type="range" id="weeks" min="2" max="24" step="1" value="8">
    </div>

    <details>
      <summary>ظروف إضافية (اختياري)</summary>
      <div class="field" style="margin-top:.8rem">
        <label>ما الذي يشغلك؟</label>
        <div class="chips" id="dutyChips">
          <button type="button" class="chip" aria-pressed="false">أطفال</button>
          <button type="button" class="chip" aria-pressed="false">رعاية أهل</button>
          <button type="button" class="chip" aria-pressed="false">مواصلات طويلة</button>
          <button type="button" class="chip" aria-pressed="false">دوام مسائي</button>
          <button type="button" class="chip" aria-pressed="false">إرهاق / صحة</button>
        </div>
      </div>
      <div class="field">
        <label for="energy">طاقتك غالبا؟</label>
        <select id="energy">
          <option>مرتفعة صباحا</option>
          <option selected>متوسطة متذبذبة</option>
          <option>منخفضة معظم اليوم</option>
          <option>مرتفعة مساء</option>
        </select>
      </div>
    </details>

    <div class="warn hidden" id="timeWarn"></div>
    <p class="error" id="err"></p>
    <button class="btn block" type="submit" id="generate">أنشئ خطتي ←</button>
  </form>

  <section class="card hidden" id="result" aria-live="polite">
    <div id="plan"></div>
    <div class="toolbar">
      <button class="btn plain" type="button" id="copyBtn">نسخ</button>
      <button class="btn plain" type="button" id="printBtn">طباعة</button>
      <button class="btn plain" type="button" id="newBtn">خطة جديدة</button>
    </div>
  </section>
</main>

<footer>مَسار — بياناتك على جهازك فقط.</footer>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};

  try{if(localStorage.getItem("masar-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}
  $("themeBtn").addEventListener("click",function(){
    var r=document.documentElement,isD=r.getAttribute("data-theme")==="dark";
    if(isD)r.removeAttribute("data-theme");else r.setAttribute("data-theme","dark");
    try{localStorage.setItem("masar-theme",isD?"light":"dark")}catch(e){}
  });

  function unit(x,one,two,many){if(x===1)return one;if(x===2)return two;if(x>=3&&x<=10)return x+" "+many;return x+" "+one}
  function bind(id,vid,fmt){var r=$(id),v=$(vid);function u(){v.textContent=fmt(parseFloat(r.value))}r.addEventListener("input",u);u();return u}
  bind("hours","hoursVal",function(x){return unit(x,"ساعة","ساعتين","ساعات")});
  bind("days","daysVal",function(x){return unit(x,"يوم","يومان","أيام")});
  bind("weeks","weeksVal",function(x){return unit(x,"أسبوع","أسبوعان","أسابيع")});

  $("dutyChips").addEventListener("click",function(e){
    if(!e.target.classList.contains("chip"))return;
    var b=e.target;
    b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true"));
  });
  function duties(){var o=[];$("dutyChips").querySelectorAll(".chip").forEach(function(c){if(c.getAttribute("aria-pressed")==="true")o.push(c.textContent.trim())});return o}

  function check(){
    var h=parseFloat($("hours").value),d=parseInt($("days").value,10),w=$("timeWarn"),m="";
    if($("job").value==="موظف دوام كامل"&&h>5)m="مع الدوام الكامل جرّب 2–3 ساعات لضمان الاستمرارية.";
    else if(h*d>35)m="أكثر من 35 ساعة أسبوعيا حمل وظيفة ثانية — راجع الرقم.";
    if(m){w.textContent="ملاحظة: "+m;w.classList.remove("hidden")}else w.classList.add("hidden");
  }
  ["hours","days","job"].forEach(function(id){$(id).addEventListener("input",check)});check();

  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
  function fmtD(dt){return dt.getDate()+"/"+(dt.getMonth()+1)}
  var JOBS={"موظف دوام كامل":"دوام كامل: التزم بعدد أيامك دون زيادة، ويوم راحة مقدس.","موظف دوام جزئي":"دوام جزئي: الجلسات الطويلة في أيام الفراغ والقصيرة في أيام العمل.","طالب":"طالب: اجعل الخطة تخدم دراستك كلما أمكن.","عمل حر":"عمل حر: ابدأ بخطتك قبل طلبات العملاء."};
  var DUTY={"أطفال":"أطفال: جلسات قصيرة قابلة للمقاطعة أثناء نومهم أو انشغالهم.","رعاية أهل":"رعاية أهل: ثبّت الجلسة في أهدأ فترة وجهّز مهام 15 دقيقة للطوارئ.","مواصلات طويلة":"مواصلات طويلة: دروس صوتية أثناء التنقل والتطبيق في البيت.","دوام مسائي":"دوام مسائي: الجلسة صباحا قبل العمل.","إرهاق / صحة":"الإرهاق: نسخة 20 دقيقة يوميا خير من الانقطاع."};
  var TRACK={
    "دخل إضافي / عمل":{day:"تعلّم تقنية وطبّقها على نموذج يصلح للبيع",kpi:"نموذج جديد أو تواصل مع عميل",ph:["التأسيس","ملف الأعمال","أول العملاء"]},
    "تعلم مهارة":{day:"درس واحد ثم تمرين فوري عليه",kpi:"تمرين مكتمل",ph:["الأساسيات","مشاريع متدرجة","مشروع ختامي"]},
    "دراسة / اختبار":{day:"فهم الدرس ثم حل أسئلته",kpi:"أسئلة محلولة أو درجة تجريبية",ph:["مسح المنهج","حل مكثف","اختبارات موقوتة"]},
    "صحة / لياقة":{day:"تمرين مع تسجيل بسيط",kpi:"رقم يتحسن: خطوات أو وزن",ph:["تثبيت العادة","رفع الشدة","تثبيت النمط"]},
    "تنظيم الديون":{day:"مراجعة مصروف وتحويلة سداد",kpi:"الدين ينخفض أسبوعيا",ph:["الحصر","خطة السداد","أتمتة السداد"]},
    "مشروع صغير":{day:"خطوة بناء وخطوة سوق",kpi:"رد فعل حقيقي من السوق",ph:["النموذج الأول","اختبار السوق","أول بيع"]}
  };

  function tasks(){try{var x=JSON.parse(localStorage.getItem("masar-tasks")||"null");if(x&&x.n)return x}catch(e){}return {n:0,checks:[]}}
  function saveTasks(x){try{localStorage.setItem("masar-tasks",JSON.stringify(x))}catch(e){}}

  function build(d){
    var weekly=Math.round(d.hours*d.days*10)/10,total=Math.round(weekly*d.weeks);
    var t=TRACK[d.kind]||TRACK["تعلم مهارة"];
    var phase=Math.max(1,Math.round(d.weeks/3)),p3=phase*2+1;if(p3>d.weeks)p3=d.weeks;
    var s=new Date();s.setDate(s.getDate()+1);
    function rg(a,b){var x=new Date(s);x.setDate(x.getDate()+a);var y=new Date(s);y.setDate(y.getDate()+b);return fmtD(x)+" – "+fmtD(y)}
    var slot=d.energy==="مرتفعة صباحا"?"صباحا قبل أي التزام.":(d.energy==="مرتفعة مساء"?"مساء وجهّز كل شيء نهارا.":"في موعد ثابت واحد يوميا.");
    var st=tasks();
    var daysArr=[];for(var i=0;i<Math.min(d.days,7);i++)daysArr.push(i+1);
    var kinds=["ابدأ: "+t.day,"طبّق وسجّل النتيجة: "+t.kpi,"راجع وجهّز الغد"];
    var lis=daysArr.map(function(n,i){
      var on=st.checks&&st.checks[i];
      return "<li><label><input type='checkbox' data-tk='"+i+"'"+(on?" checked":"")+"><span><b>اليوم "+n+":</b> "+esc(kinds[i%3])+"</span></label></li>";
    }).join("");
    var dut=d.duties.length?d.duties.map(function(x){return "<li>"+esc(DUTY[x]||x)+"</li>"}).join(""):"";
    return "<h3>خطتك: "+esc(d.goal)+"</h3>"
    +"<p class='sum'>"+weekly+" ساعات أسبوعيا × "+d.weeks+" أسابيع = "+total+" ساعة إجمالا</p>"
    +"<h4>جلستك اليومية ("+d.hours+" س)</h4><ul>"
    +"<li>الموعد: "+slot+"</li>"
    +"<li>"+esc(JOBS[d.job]||"التزم بنفس الموعد يوميا.")+"</li>"+dut+"</ul>"
    +"<h4>المراحل</h4><table><tr><th>الأسابيع</th><th>التركيز</th><th>الدليل</th></tr>"
    +"<tr><td>1–"+phase+"<br><small>"+rg(0,phase*7-1)+"</small></td><td>"+esc(t.ph[0])+"</td><td>الأساس دون تخطي</td></tr>"
    +"<tr><td>"+(phase+1)+"–"+(phase*2)+"<br><small>"+rg(phase*7,phase*14-1)+"</small></td><td>"+esc(t.ph[1])+"</td><td>"+esc(t.kpi)+"</td></tr>"
    +"<tr><td>"+p3+"–"+d.weeks+"<br><small>"+rg(phase*14,d.weeks*7-1)+"</small></td><td>"+esc(t.ph[2])+"</td><td>هدفك متحقق جزئيا</td></tr></table>"
    +"<h4>الأسبوع الأول (يبدأ "+fmtD(s)+")</h4><ul class='check'>"+lis+"</ul>"
    +"<h4>عند التعثر</h4><ul><li>ضاع يوم؟ وزّعه 30 دقيقة على اليومين التاليين فقط.</li><li>بلا طاقة؟ نسخة 20 دقيقة تُحتسب يوما منجزا.</li></ul>";
  }

  $("plan").addEventListener("change",function(e){
    var cb=e.target.closest?e.target.closest("input[data-tk]"):null;if(!cb)return;
    var st=tasks();st.checks[parseInt(cb.getAttribute("data-tk"),10)]=cb.checked;saveTasks(st);
  });

  $("form").addEventListener("submit",function(e){
    e.preventDefault();
    var goal=$("goalText").value.trim();
    if(goal.length<10){$("err").textContent="اكتب هدفك بجملة واضحة.";return}
    $("err").textContent="";
    var d={hours:parseFloat($("hours").value),days:parseInt($("days").value,10),job:$("job").value,
      kind:$("goalKind").value,goal:goal,weeks:parseInt($("weeks").value,10),
      duties:duties(),energy:$("energy").value};
    try{localStorage.setItem("masar-data",JSON.stringify(d))}catch(err){}
    var tk=[];for(var i=0;i<Math.min(d.days,7);i++)tk.push(false);saveTasks({n:d.days,checks:tk});
    $("plan").innerHTML=build(d);
    $("result").classList.remove("hidden");
    $("result").scrollIntoView({behavior:"smooth"});
  });

  function text(){return $("plan").innerText||$("plan").textContent}
  $("copyBtn").addEventListener("click",function(){
    var t=text(),b=this;
    function done(m){var o=b.textContent;b.textContent=m;setTimeout(function(){b.textContent=o},1500)}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){done("تم ✓")},function(){done("تعذّر")});
    else{var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done("تم ✓")}catch(x){}ta.remove()}
  });
  $("printBtn").addEventListener("click",function(){window.print()});
  $("newBtn").addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"})});

  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("./sw.js").catch(function(){})}
})();
</script>
</body>
</html>
